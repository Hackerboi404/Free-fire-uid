services:
  - type: web
    name: telegram-group-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DB_PATH
        value: /var/data/bot_data.db
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
